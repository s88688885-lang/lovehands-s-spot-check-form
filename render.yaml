databases:
  - name: lovehands-spot-db
    databaseName: lovehands_spot
    user: lovehands_spot
services:
  - type: web
    name: lovehands-spot-check
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lovehands-spot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: SETUP_TOKEN
        sync: false
